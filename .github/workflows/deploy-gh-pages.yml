name: Deploy static site to gh-pages branch (fallback)

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Ensure static output
        run: |
          if [ -d out ]; then
            echo "out/ exists" && ls -lah out
          else
            echo "out/ not found, listing workspace:" && ls -lah
            exit 1
          fi

      - name: Commit and push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git init out
          cd out
          git checkout -b gh-pages || git switch gh-pages
          git add --all
          git commit -m "chore: publish static export to gh-pages" || true
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" gh-pages:gh-pages
    permissions:
      contents: read
      pages: write
